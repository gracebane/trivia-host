<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Trivia — Join</title>
		<link rel="stylesheet" href="styles.css" />
		<!-- the birthday skin and its two switches, applied when <body> carries rbd / mono / strict -->
		<link rel="stylesheet" href="rbd.css" />
		<link rel="stylesheet" href="rbd-strict.css" />
		<link rel="stylesheet" href="rbd-font.css" />
		<link rel="stylesheet" href="rbd-screens.css" />
	</head>
	<body class="door">
		<!-- One site, two doors (spec: "Entry model"). The doors are deliberately
		     NOT symmetrical: every guest uses the player door, and exactly one
		     person ever uses the host door. A guest who taps "Host" gets a
		     passphrase box they cannot satisfy, which reads as broken, so the host
		     entrance is a small link rather than a matching button.

		     Players need no password: the host's Open room switch is the only
		     gate. The host passphrase stays, and only guards the host door. -->
		<script>
			// ?mock (or a file URL): the door to the design playground and its wall.
			// Otherwise: the real door, in front of the live game.
			const PARAMS = new URLSearchParams(location.search);
			const MOCK = PARAMS.has("mock") || location.protocol === "file:";
			document.body.classList.toggle("live", !MOCK);
			// ?tv=1: the join screen for the TV. The address and the code in the
			// phones' style, nothing else: no button, no host entrance.
			const TV = PARAMS.has("tv");
			document.body.classList.toggle("tv", TV);
		</script>
		<div class="card">
			<p class="brand">Trivia</p>
			<p class="sub" id="sub">Scan the code, or tap below</p>

			<div class="row">
				<a class="btn big" id="joinLink" href="devices.html">Join as a player</a>
			</div>
			<p class="note" id="shut" style="display: none">The room isn't open yet. The host will start it shortly.</p>
			<p class="note" id="wallNote"></p>

			<div class="qr">
				<img id="qr" alt="QR to join" />
			</div>
			<p class="url" id="url"></p>

			<!-- The host entrance. Tucked under a rule, muted, no button chrome. -->
			<div class="hostdoor">
				<a class="plain" id="hostLink" href="#">Host</a>
				<form id="hostForm" style="display: none">
					<input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" />
					<button type="submit">Enter</button>
					<a class="plain" id="hostCancel" href="#">Cancel</a>
					<p class="note" id="err" style="color: #c00; display: none">That isn't the passphrase</p>
				</form>
			</div>
		</div>

		<!-- Mock host state — NOT part of the door. In the real app the server
		     answers "is the room open" and this page asks it on load. -->
		<div class="simbar">
			<b>Simulate host</b> (mock only) &nbsp;
			<label><input type="checkbox" id="openToggle" /> Room is open</label>
			&nbsp; <label><input type="checkbox" id="rbdToggle" /> Birthday skin <span class="muted">— the wall opens rbd_player</span></label>
		</div>

		<script src="live.js"></script>
		<script>
			// The room gate. localStorage stands in for the server's answer, and is
			// shared with the player page so the two agree in the mock.
			const ROOM_KEY = "mockRoomOpen";
			const roomOpen = () => {
				try {
					return localStorage.getItem(ROOM_KEY) === "1";
				} catch {
					return false;
				}
			};
			const joinLink = document.getElementById("joinLink");
			const openToggle = document.getElementById("openToggle");
			let roomLive = null; // live: the room's answer, once it has arrived
			function paintRoom() {
				if (!MOCK) {
					const open = roomLive !== false; // until the room answers, the door is open
					joinLink.href = "player.html";
					joinLink.classList.toggle("disabled", !open);
					joinLink.textContent = open ? "Join as a player" : "Room not open";
					document.getElementById("shut").style.display = open ? "none" : "";
					return;
				}
				const open = roomOpen();
				openToggle.checked = open;
				joinLink.classList.toggle("disabled", !open);
				joinLink.textContent = open ? "Join as a player" : "Room not open";
				document.getElementById("shut").style.display = open ? "none" : "";
			}
			joinLink.addEventListener("click", (e) => {
				if (MOCK ? !roomOpen() : roomLive === false) e.preventDefault(); // the server would reject the JOIN anyway
			});
			openToggle.addEventListener("change", () => {
				try {
					localStorage.setItem(ROOM_KEY, openToggle.checked ? "1" : "0");
				} catch {}
				paintRoom();
			});
			// another tab (the player page) changing it repaints this one
			window.addEventListener("storage", (e) => e.key === ROOM_KEY && paintRoom());
			paintRoom();

			// The host passphrase guards the host door only. Players have no password.
			const HOST_PASSPHRASE = "imwithstupid";
			const TOKEN_KEY = "hostToken";

			const hostLink = document.getElementById("hostLink");
			const hostForm = document.getElementById("hostForm");
			const pass = document.getElementById("pass");
			const err = document.getElementById("err");

			// A correct passphrase mints a session token so a refresh doesn't re-prompt.
			// The passphrase itself stays sufficient from any device — that's the
			// battery-death recovery path, so the token is a convenience, not a key.
			let token = null;
			try {
				token = MOCK ? localStorage.getItem(TOKEN_KEY) : localStorage.getItem("hostKey");
			} catch {}
			if (token) hostLink.textContent = "Continue as host";

			function enterHost() {
				// live: the host page presents the passphrase to the room; a wrong one is refused there
				location.href = MOCK ? "host.html?code=" + encodeURIComponent(HOST_PASSPHRASE) : "host.html";
			}

			hostLink.addEventListener("click", (e) => {
				e.preventDefault();
				if (token) return enterHost(); // already signed in on this browser
				hostLink.style.display = "none";
				hostForm.style.display = "block";
				pass.focus();
			});
			document.getElementById("hostCancel").addEventListener("click", (e) => {
				e.preventDefault();
				hostForm.style.display = "none";
				hostLink.style.display = "";
				err.style.display = "none";
				pass.value = "";
			});
			hostForm.addEventListener("submit", (e) => {
				e.preventDefault();
				if (!MOCK) {
					try {
						localStorage.setItem("hostKey", pass.value.trim());
					} catch {}
					return enterHost();
				}
				if (pass.value.trim() !== HOST_PASSPHRASE) {
					err.style.display = "block";
					pass.select();
					return;
				}
				try {
					localStorage.setItem(TOKEN_KEY, "mock-" + Date.now());
				} catch {}
				enterHost();
			});

			// Which phone the door opens: the plain one, or the Birthday Mode skin.
			// Same app either way — rbd_player.html is generated from player.html.
			const RBD_KEY = "mockRbdSkin";
			const rbdOn = () => {
				try {
					return localStorage.getItem(RBD_KEY) === "1";
				} catch {
					return false;
				}
			};
			const rbdToggle = document.getElementById("rbdToggle");
			const $note = document.getElementById("wallNote");
			const oneLink = { set href(v) {} }; // the link is rebuilt inside the note
			function paintSkin() {
				if (!MOCK) {
					$note.style.display = "none"; // the live door is for guests: no playground, no wall
					return;
				}
				const on = rbdOn();
				rbdToggle.checked = on;
				oneLink.href = on ? "rbd_player.html" : "player.html";
				$note.innerHTML = `Opens the device wall — every screen size at once, ${on ? "in the <b>birthday skin</b>" : "in the plain skin"}. <a class="plain" id="oneLink" href="${on ? "rbd_player.html" : "player.html"}">One phone only</a>`;
			}
			rbdToggle.addEventListener("change", () => {
				try {
					localStorage.setItem(RBD_KEY, rbdToggle.checked ? "1" : "0");
				} catch {}
				paintSkin();
				mockSkin();
			});
			window.addEventListener("storage", (e) => e.key === RBD_KEY && paintSkin());
			paintSkin();

			// The door dresses like the phones. Live, the room says which skin, which
			// face and whether the strict layer is on; in the mock those are the device
			// wall's flags, so the playground's door matches its phones.
			function applySkin(st) {
				document.body.classList.toggle("rbd", !!st.birthdayMode);
				document.body.classList.toggle("mono", st.egaFont === "mono");
				document.body.classList.toggle("strict", !!st.egaStrict);
			}
			function mockSkin() {
				try {
					applySkin({ birthdayMode: rbdOn(), egaFont: localStorage.getItem("mockEgaFont"), egaStrict: localStorage.getItem("mockEgaStrict") === "1" });
				} catch {}
			}
			window.addEventListener("storage", (e) => MOCK && ["mockEgaFont", "mockEgaStrict"].includes(e.key) && mockSkin());
			if (MOCK) mockSkin();
			else
				TriviaLive.connect({
					role: "board", // the door only watches: no key, nothing to send
					onSnapshot: (s) => {
						applySkin(s.settings ?? {});
						roomLive = !!s.open;
						paintRoom();
					},
				});
			if (TV) document.getElementById("sub").textContent = "Scan the code, or type the address";

			// The QR still encodes the single-phone path: something scanning this is a
			// real phone and wants the app, not the wall of emulated ones.
			// Live it encodes the short route, /play, which is also what the TV shows
			// in words for anyone whose camera won't play along.
			const target = MOCK ? new URL("player.html?mock", location.href).href : new URL("/play", location.href).href;
			document.getElementById("url").textContent = MOCK ? "" : location.host + "/play";
			const qr = document.getElementById("qr");
			const px = TV ? 320 : 150;
			qr.src = `https://api.qrserver.com/v1/create-qr-code/?size=${px}x${px}&qzone=1&data=` + encodeURIComponent(target);
			qr.onerror = () => {
				qr.replaceWith(
					Object.assign(document.createElement("div"), {
						textContent: "QR offline",
						style: "color:#767676;font-size:12px",
					}),
				);
			};
		</script>
	</body>
</html>
