<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Trivia — Join</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<!-- One site, two doors (spec: "Entry model"). The doors are deliberately
		     NOT symmetrical: every guest uses the player door, and exactly one
		     person ever uses the host door. A guest who taps "Host" gets a
		     passphrase box they cannot satisfy, which reads as broken, so the host
		     entrance is a small link rather than a matching button.

		     Mock divergence from the spec: the player button goes straight through
		     rather than asking for the lobby password (imstupid). In the real app
		     that password is the room identifier and still gates entry; the QR
		     embeds it so scanning bypasses the field anyway. -->
		<div class="card">
			<p class="brand">Trivia</p>
			<p class="sub">Scan the code, or tap below</p>

			<div class="row">
				<a class="btn big" id="joinLink" href="devices.html">Join as a player</a>
			</div>
			<p class="note" id="shut" style="display: none">The room isn't open yet. The host will start it shortly.</p>
			<p class="note" id="wallNote"></p>

			<div class="qr">
				<img id="qr" alt="QR to join" />
			</div>
			<p class="note">Scan to join on a phone (placeholder)</p>

			<!-- The host entrance. Tucked under a rule, muted, no button chrome. -->
			<div class="hostdoor">
				<a class="plain" id="hostLink" href="#">Host</a>
				<form id="hostForm" style="display: none">
					<input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" />
					<button type="submit">Enter</button>
					<a class="plain" id="hostCancel" href="#">Cancel</a>
					<p class="note" id="err" style="color: #c00; display: none">That isn't the passphrase</p>
				</form>
			</div>
		</div>

		<!-- Mock host state — NOT part of the door. In the real app the server
		     answers "is the room open" and this page asks it on load. -->
		<div class="simbar">
			<b>Simulate host</b> (mock only) &nbsp;
			<label><input type="checkbox" id="openToggle" /> Room is open</label>
			&nbsp; <label><input type="checkbox" id="rbdToggle" /> Birthday skin <span class="muted">— the wall opens rbd_player</span></label>
		</div>

		<script>
			// The room gate. localStorage stands in for the server's answer, and is
			// shared with the player page so the two agree in the mock.
			const ROOM_KEY = "mockRoomOpen";
			const roomOpen = () => {
				try {
					return localStorage.getItem(ROOM_KEY) === "1";
				} catch {
					return false;
				}
			};
			const joinLink = document.getElementById("joinLink");
			const openToggle = document.getElementById("openToggle");
			function paintRoom() {
				const open = roomOpen();
				openToggle.checked = open;
				joinLink.classList.toggle("disabled", !open);
				joinLink.textContent = open ? "Join as a player" : "Room not open";
				document.getElementById("shut").style.display = open ? "none" : "";
			}
			joinLink.addEventListener("click", (e) => {
				if (!roomOpen()) e.preventDefault(); // the server would reject the JOIN anyway
			});
			openToggle.addEventListener("change", () => {
				try {
					localStorage.setItem(ROOM_KEY, openToggle.checked ? "1" : "0");
				} catch {}
				paintRoom();
			});
			// another tab (the player page) changing it repaints this one
			window.addEventListener("storage", (e) => e.key === ROOM_KEY && paintRoom());
			paintRoom();

			// Hardcoded for now, per spec. The player password (imstupid) is the room
			// identifier in the real app; the host passphrase is independent of it.
			const HOST_PASSPHRASE = "imwithstupid";
			const TOKEN_KEY = "hostToken";

			const hostLink = document.getElementById("hostLink");
			const hostForm = document.getElementById("hostForm");
			const pass = document.getElementById("pass");
			const err = document.getElementById("err");

			// A correct passphrase mints a session token so a refresh doesn't re-prompt.
			// The passphrase itself stays sufficient from any device — that's the
			// battery-death recovery path, so the token is a convenience, not a key.
			let token = null;
			try {
				token = localStorage.getItem(TOKEN_KEY);
			} catch {}
			if (token) hostLink.textContent = "Continue as host";

			function enterHost() {
				location.href = "host.html?code=" + encodeURIComponent(HOST_PASSPHRASE);
			}

			hostLink.addEventListener("click", (e) => {
				e.preventDefault();
				if (token) return enterHost(); // already signed in on this browser
				hostLink.style.display = "none";
				hostForm.style.display = "block";
				pass.focus();
			});
			document.getElementById("hostCancel").addEventListener("click", (e) => {
				e.preventDefault();
				hostForm.style.display = "none";
				hostLink.style.display = "";
				err.style.display = "none";
				pass.value = "";
			});
			hostForm.addEventListener("submit", (e) => {
				e.preventDefault();
				if (pass.value.trim() !== HOST_PASSPHRASE) {
					err.style.display = "block";
					pass.select();
					return;
				}
				try {
					localStorage.setItem(TOKEN_KEY, "mock-" + Date.now());
				} catch {}
				enterHost();
			});

			// Which phone the door opens: the plain one, or the Birthday Mode skin.
			// Same app either way — rbd_player.html is generated from player.html.
			const RBD_KEY = "mockRbdSkin";
			const rbdOn = () => {
				try {
					return localStorage.getItem(RBD_KEY) === "1";
				} catch {
					return false;
				}
			};
			const rbdToggle = document.getElementById("rbdToggle");
			const $note = document.getElementById("wallNote");
			const oneLink = { set href(v) {} }; // the link is rebuilt inside the note
			function paintSkin() {
				const on = rbdOn();
				rbdToggle.checked = on;
				oneLink.href = (on ? "rbd_player.html" : "player.html") + "?code=imstupid";
				$note.innerHTML = `Opens the device wall — every screen size at once, ${on ? "in the <b>birthday skin</b>" : "in the plain skin"}. <a class="plain" id="oneLink" href="${on ? "rbd_player.html" : "player.html"}?code=imstupid">One phone only</a>`;
			}
			rbdToggle.addEventListener("change", () => {
				try {
					localStorage.setItem(RBD_KEY, rbdToggle.checked ? "1" : "0");
				} catch {}
				paintSkin();
			});
			window.addEventListener("storage", (e) => e.key === RBD_KEY && paintSkin());
			paintSkin();

			// The QR still encodes the single-phone path: something scanning this is a
			// real phone and wants the app, not the wall of emulated ones.
			const target = new URL("player.html?code=imstupid", location.href).href;
			const qr = document.getElementById("qr");
			qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(target);
			qr.onerror = () => {
				qr.replaceWith(
					Object.assign(document.createElement("div"), {
						textContent: "QR offline",
						style: "color:#767676;font-size:12px",
					}),
				);
			};
		</script>
	</body>
</html>
