<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Trivia — Leaderboard</title>
		<link rel="stylesheet" href="styles.css" />
		<!-- the birthday skin and its two switches, applied when <body> carries rbd / mono / strict -->
		<link rel="stylesheet" href="rbd.css" />
		<link rel="stylesheet" href="rbd-strict.css" />
		<link rel="stylesheet" href="rbd-font.css" />
		<link rel="stylesheet" href="rbd-screens.css" />
	</head>
	<body class="board">
		<!-- The ?view=leaderboard client. Opened as a tab from the host, torn out to
		     the TV once at setup, alt-tabbed to between rounds. It's a moment, not
		     an ambient display. Ranks arrive already computed by the host, under
		     whichever tie rule is set there; scores alongside ranks are a host
		     toggle (default on). In the real app this is
		     its own socket client; in the mock it reads what host.html publishes to
		     localStorage and updates on the storage event. -->
		<div class="card">
			<p class="brand">Trivia</p>
			<p class="sub" id="sub">Standings</p>
			<table class="board-table"><tbody id="board"></tbody></table>
			<p class="note" id="empty" style="display: none">Nothing yet.</p>
		</div>
		<script src="live.js"></script>
		<script>
			const PARAMS = new URLSearchParams(location.search);
			const MOCK = PARAMS.has("mock") || location.protocol === "file:";
			const fmtRank = (r) => (Number.isInteger(r) ? String(r) : r.toFixed(1));
			let liveData = null; // live: the board's own snapshot, the same shape the mock publishes
			function render() {
				let d = liveData;
				if (MOCK)
					try {
						d = JSON.parse(localStorage.getItem("mockStandings") || "null");
					} catch {}
				const tb = document.getElementById("board");
				tb.innerHTML = "";
				document.getElementById("empty").style.display = d ? "none" : "block";
				if (!d) return;
				document.getElementById("sub").textContent =
					d.phase === "ended" ? "Final standings" : d.q ? `Standings after question ${d.q} of ${d.total}` : "Standings";
				for (const p of d.standings) {
					const tr = document.createElement("tr");
					tr.innerHTML =
						`<td class="rank">${fmtRank(p.rank)}</td><td>${p.displayName.replace(/[&<>]/g, "")}</td>` +
						(d.showScores ? `<td class="score">${p.score}</td>` : "");
					tb.appendChild(tr);
				}
			}
			// The board dresses like the phones: the skin, the face and the strict
			// layer are the room's settings live, and the device wall's flags in the mock.
			function applySkin(st) {
				document.body.classList.toggle("rbd", !!st.birthdayMode);
				document.body.classList.toggle("mono", st.egaFont === "mono");
				document.body.classList.toggle("strict", !!st.egaStrict);
			}
			function mockSkin() {
				try {
					applySkin({ birthdayMode: localStorage.getItem("mockRbdSkin") === "1", egaFont: localStorage.getItem("mockEgaFont"), egaStrict: localStorage.getItem("mockEgaStrict") === "1" });
				} catch {}
			}
			window.addEventListener("storage", (e) => {
				if (e.key === "mockStandings") render();
				if (MOCK && ["mockRbdSkin", "mockEgaFont", "mockEgaStrict"].includes(e.key)) mockSkin();
			});
			if (!MOCK) TriviaLive.connect({ role: "board", onSnapshot: (s) => (applySkin(s.settings ?? {}), (liveData = s), render()) });
			else mockSkin();
			render();
		</script>
	</body>
</html>
